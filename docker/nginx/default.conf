server {
    listen 80;
    server_tokens off;
    server_name karlhill.com www.karlhill.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://karlhill.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_tokens off;
    server_name www.karlhill.com;

    ssl_certificate /etc/letsencrypt/live/karlhill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karlhill.com/privkey.pem;

    return 301 https://karlhill.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    server_name karlhill.com;

    ssl_certificate /etc/letsencrypt/live/karlhill.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karlhill.com/privkey.pem;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Security headers (CSP, X-Frame-Options, HSTS, etc.) are set by the
    # Laravel SecurityHeaders middleware so local dev matches production.

    # Compress text responses (HTML from PHP, CSS/JS, JSON, XML feeds, SVG).
    # text/html is always included by nginx. woff2/webp/avif are pre-compressed.
    # Keep this block in sync with the karlhill.com server block in the live
    # /home/karl/data/nginx/default.conf on the production host.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/manifest+json
        application/xml application/xml+rss application/atom+xml application/rss+xml
        image/svg+xml;

    # Vite emits content-hashed filenames, so these can be cached forever.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images are not hashed; 30 days balances freshness against re-downloads.
    location ^~ /img/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
