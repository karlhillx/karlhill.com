[project]
name = "linkpress-qr"
version = "0.1.0"
description = "Linkpress QR — Clean QR codes. Ready for print."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Linkpress QR contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "segno>=1.6.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
linkpress-qr = "linkpress_qr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkpress_qr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
    "zxing-cpp>=3.1.1",
]
