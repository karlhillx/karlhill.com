# Canonical sensory descriptors. Store IDs on reviews; display labels in the UI.
# Hierarchy is parent → child for vocabulary browsing; any leaf or mid-node may be tagged.
#
# Map free-text tasting language onto these IDs. Prose may still say "freshly ground coffee";
# the chip stores `coffee`.

