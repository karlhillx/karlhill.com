title: string; public headline, usually brand + product
slug: kebab-case, no dates
id: TDS-#### internal identifier, optional; do not render
ean: sourced barcode when known, optional; do not render
brand: producer or label house
product: SKU name; do not repeat brand; do not append Non-Alcoholic {category}
category: wine | beer | spirits | cocktails | cider
subcategory: string, optional
country: string, sourced
region: string, sourced
style: string, editorial
style_slug: optional closed-vocab override (see styles.yaml)
abv: 0.0% | <0.5% | Not published
abv_numeric: number <= 0.5, optional
production_type: dealcoholized | alternative | naturally-low-alcohol | hybrid | not-verified
verified: yes | no
production_note: optional display override
dealcoholization_method: string, sourced when production_type=dealcoholized
base_beverage: string, sourced
producer: string, sourced
price: approximate retail, sourced
volume: string, sourced
ingredients: string, sourced
calories: string, sourced
sugar: string, sourced
availability: string, sourced
purchase_links:
  - label: string
    url: url
    region: optional
    retailer: optional
    price: optional
    currency: optional
    availability: optional
    last_verified: YYYY-MM-DD, optional
    relationship: citation | affiliate | paid | unknown
    referral_type: optional
    affiliate_url: optional; store only; do not use as the public href
product_id: TDS-#### durable key; defaults to id
identifiers:
  - type: gtin | ean | upc | mfr | asin | tds
    value: string
    source: optional
producer_slug: optional
acquisition: purchased | manufacturer-sample | distributor-sample | unknown
sponsored: yes | no
affiliate_relationship: none | present
advertising_relationship: none | present
commercial_relationship: none | brand | retailer | distributor | other
disclosure_note: optional public sentence
provenance:
  abv: {kind: manufacturer | label | retailer | distributor | government | research | press | inference | unknown}
review_date: YYYY-MM-DD
updated_date: YYYY-MM-DD
rating: 0-100
verdict: editorial
summary: editorial
nose: editorial
palate: editorial
finish: editorial
structure: editorial, optional; structural authenticity (legacy alias for likeness when likeness is empty)
tastes: list of short flavor tags for the glance panel
profile: list of structure chips (legacy; prefer structure_scales)
mouthfeel: editorial short line for the glance panel
highlight: editorial; what stands out
likeness: editorial; how wine/beer/spirit-like — separate from the quality score; must not copy verdict
drink_if_you_like: list of comparable styles or bottles, optional
sensory:
  - descriptor: canonical id from descriptors.yaml (e.g. roasted_barley, coffee, green_apple)
    locations: [nose | palate | finish]
    intensity: low | moderate | high, optional
structure_scales:
  sweetness: 0-4  # bone dry → sweet
  acidity: 0-4
  body: 0-3
  tannin: 0-3
  bitterness: 0-3
  carbonation: 0-3
  alcohol_heat: 0-3
  finish_length: 0-2
  flavor_intensity: 0-2
  aromatic_intensity: 0-2
  texture: thin | lean | crisp | rounded | creamy | viscous | syrupy
assessments:
  likeness: 0-2
  structural_authenticity: 0-2
  balance: 0-2
  complexity: 0-2
  finish_quality: 0-2
  value: 0-2
  standalone_appeal: 0-2
best_for: editorial; Perfect for / occasions
serve: editorial
sources:
  - title: string
    url: url
    claims: [abv, method, origin, producer, ingredients, calories, sugar, price, availability, volume, production_type, dealcoholized, base_beverage, country, region]
discrepancies:
  - field: string
    note: string
image: path under media/reviews/{slug}.jpg, optional override
image_alt: string, optional; defaults to title
image_credit: Editorial still | Product photo via {producer-or-importer}
image_source: editorial | producer | importer
image_source_url: url to the original asset page; required unless image_source is editorial
image_sku_confirmed: yes | no; yes only after a human confirms the label matches this SKU
status: queued | researching | researched | draft | tasted | reviewed | validated | approved | scheduled | published | needs-review
# researched/tasted/reviewed/approved are workflow aliases; runtime normalizes to researching|draft|validated.

# Domain notes
# Product facts (brand, ABV, method, sugar, GTIN, …) live on the product identity.
# Review observations (score, sensory, structure_scales, assessments, nose/palate/finish) live on the review.
# Public glance labels: Flavor profile (sensory) · Structure (structure_scales) · Nose/Palate/Finish (prose).
# Prefer structure_scales + sensory over free-text tastes/profile; legacy chips still render as fallback.
# ABV display labels: 0.0% | <0.5% | Not published — keep abv_numeric for precise values.
# method_facet override: vacuum-distillation | spinning-cone | reverse-osmosis | membrane-filtration | osmotic-distillation | arrested-fermentation | other | unpublished | not-applicable
# provenance confidence: verified | manufacturer_verified | label_verified | secondary | inferred | unverified
#   aliases: bottle_verified→label_verified, producer_verified→manufacturer_verified, independently_corroborated→verified
# Descriptor aliases: data/schema/descriptor-aliases.yaml (do not invent tasting notes)
# Editorial length (soft warnings): verdict 150–300 · nose 100–250 · palate 200–400 · finish 100–250 · total ~2500–3500
# See also: descriptors.yaml, structure.yaml, assessments.yaml, Registry.php
