# Editorial assessment dimensions. Separate from product facts and sensory description.
# Public UI may show qualitative labels; numeric internals stay optional.

likeness:
  label: Category likeness
  levels:
    0: { id: low, label: Low }
    1: { id: moderate, label: Moderate }
    2: { id: high, label: High }

structural_authenticity:
  label: Structural authenticity
  levels:
    0: { id: low, label: Low }
    1: { id: moderate, label: Moderate }
    2: { id: high, label: High }

balance:
  label: Balance
  levels:
    0: { id: low, label: Uneven }
    1: { id: moderate, label: Balanced }
    2: { id: high, label: Well balanced }

complexity:
  label: Complexity
  levels:
    0: { id: low, label: Simple }
    1: { id: moderate, label: Moderate }
    2: { id: high, label: Complex }

finish_quality:
  label: Finish quality
  levels:
    0: { id: low, label: Abrupt }
    1: { id: moderate, label: Clean }
    2: { id: high, label: Lingering }

value:
  label: Value
  levels:
    0: { id: low, label: Poor value }
    1: { id: moderate, label: Fair value }
    2: { id: high, label: Strong value }

standalone_appeal:
  label: Standalone appeal
  levels:
    0: { id: low, label: Context-dependent }
    1: { id: moderate, label: Pleasant alone }
    2: { id: high, label: Compelling alone }
