# Structural scales for reviews. Store integer levels (or texture enum);
# map to display labels for the Structure glance line and filters.

sweetness:
  label: Sweetness
  levels:
    0: { id: bone_dry, label: Bone dry }
    1: { id: dry, label: Dry }
    2: { id: off_dry, label: Off-dry }
    3: { id: medium, label: Medium-sweet }
    4: { id: sweet, label: Sweet }

acidity:
  label: Acidity
  levels:
    0: { id: low, label: Low acidity }
    1: { id: moderate_low, label: Soft acidity }
    2: { id: moderate, label: Moderate acidity }
    3: { id: moderate_high, label: Bright acidity }
    4: { id: high, label: High acidity }

body:
  label: Body
  levels:
    0: { id: very_light, label: Very light }
    1: { id: light, label: Light body }
    2: { id: medium, label: Medium body }
    3: { id: full, label: Full body }

tannin:
  label: Tannin
  levels:
    0: { id: none, label: No tannin }
    1: { id: low, label: Low tannin }
    2: { id: moderate, label: Moderate tannin }
    3: { id: high, label: High tannin }

bitterness:
  label: Bitterness
  levels:
    0: { id: none, label: No bitterness }
    1: { id: low, label: Modest bitterness }
    2: { id: moderate, label: Moderate bitterness }
    3: { id: high, label: High bitterness }

carbonation:
  label: Carbonation
  levels:
    0: { id: still, label: Still }
    1: { id: light, label: Light spritz }
    2: { id: moderate, label: Soft bead }
    3: { id: high, label: High sparkle }

alcohol_heat:
  label: Alcohol-like heat
  levels:
    0: { id: none, label: No heat }
    1: { id: low, label: Low heat }
    2: { id: moderate, label: Moderate heat }
    3: { id: high, label: Hot }

finish_length:
  label: Finish length
  levels:
    0: { id: short, label: Short finish }
    1: { id: medium, label: Medium finish }
    2: { id: long, label: Long finish }

flavor_intensity:
  label: Flavor intensity
  levels:
    0: { id: delicate, label: Delicate }
    1: { id: moderate, label: Moderate intensity }
    2: { id: pronounced, label: Pronounced }

aromatic_intensity:
  label: Aromatic intensity
  levels:
    0: { id: delicate, label: Delicate nose }
    1: { id: moderate, label: Moderate nose }
    2: { id: pronounced, label: Pronounced nose }

texture:
  label: Texture
  values:
    thin: Thin
    lean: Lean
    crisp: Crisp
    rounded: Rounded
    creamy: Creamy
    viscous: Viscous
    syrupy: Syrupy

