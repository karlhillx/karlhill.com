site:
  name: The Dry Standard
  tagline: Independent reviews of dealcoholized beer, wine, spirits, and cocktails.
  description: Editorial reviews of dealcoholized and non-alcoholic drinks at 0.5% ABV or less, with a hard line between alcohol-removed products and zero-proof formulations.
  mission: The Dry Standard concentrates on beverages at 0.5% ABV or less. We give particular weight to drinks made by removing alcohol from a finished beer, wine, or spirit — and we say so when a product was simply formulated to taste like one.
  base_path: /clients/the-dry-standard
  canonical_host: https://karlhill.com
  index: false

editor:
  name: Karl Hill
  role: Editor
  email: drinkdrystandard@gmail.com
  location: Washington, DC

publishing:
  enabled: true
  reviews_per_week: 3
  days:
    - monday
    - wednesday
    - friday
  git_commit: false
  require_validation: true

models:
  research: local
  drafting: local
  editing: local
  validation: local
  fallback: disabled

categories:
  wine: Wine
  beer: Beer
  spirits: Spirits
  cocktails: Cocktails
  cider: Cider

methods:
  vacuum-distillation: Vacuum distillation
  spinning-cone: Spinning cone column
  reverse-osmosis: Reverse osmosis
  membrane-filtration: Membrane / cold filtration
  osmotic-distillation: Osmotic distillation
  arrested-fermentation: Arrested fermentation
  unpublished: Method unpublished
  other: Other documented method
  not-applicable: Formulated (no removal)

rating:
  scale: 100
  description: Scores judge beverage quality, not how closely a drink impersonates ethanol.

analytics:
  enabled: true
