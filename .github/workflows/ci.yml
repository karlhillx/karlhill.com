name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none
          coverage: none

      - name: Check PHP and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done < <(git ls-files -z '*.php')
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z '*.sh')
          echo "PHP and shell syntax checks passed."

  test:
    if: github.event_name == 'workflow_dispatch'
    needs: syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # gd is unused for OG cards (static JPGs from og:generate) but kept
          # for any remaining image helpers.
          extensions: dom, mbstring, fileinfo, gd
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint

      - name: Check JS formatting
        run: npm run format:check

      - name: Build assets
        run: npm run build

      - name: Check bundle size budget
        run: bash scripts/check-bundle-size.sh

      - name: Lint PHP
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: composer test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Prepare application env
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate --force

      - name: Accessibility audit + Playwright smoke
        env:
          A11Y_FIXTURES: "true"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8000"
        run: |
          set -euo pipefail
          mkdir -p storage/logs
          A11Y_FIXTURES=true php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/artisan-serve.log 2>&1 &
          SERVE_PID=$!
          trap 'kill "$SERVE_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/up > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "artisan serve failed to become ready"
            cat storage/logs/artisan-serve.log
            exit 1
          fi
          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
          if [ "$HOME_STATUS" != "200" ]; then
            echo "Homepage returned HTTP $HOME_STATUS"
            cat storage/logs/artisan-serve.log
            exit 1
          fi
          npm run a11y
          PLAYWRIGHT_SKIP_WEBSERVER=1 npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
