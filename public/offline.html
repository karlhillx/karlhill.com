<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#080808">
    <meta name="color-scheme" content="dark">
    <title>Offline — Karl Hill</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080808;
            color: #e5e5e5;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            margin: 0 0 1rem;
        }
        p { color: #a3a3a3; line-height: 1.6; max-width: 28rem; margin: 0 auto 1.5rem; }
        a { color: #c8f542; }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>This page isn't cached yet. Reconnect, or open a post you visited earlier — writing stays available offline once loaded.</p>
        <p><a href="/blog">Back to writing</a></p>
    </main>
</body>
</html>
